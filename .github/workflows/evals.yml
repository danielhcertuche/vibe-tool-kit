# Evals con modelo: cuestan tokens y por defecto publican en claude.ai, así que solo corren a mano,
# con --no-publish y tope de gasto (ADR-009).
name: evals
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: plugin a evaluar
        required: true
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: "claude CLI (reintenta: el binario nativo opcional a veces no baja)"
        run: |
          for _ in 1 2 3; do
            npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@2.1.301" || true
            node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs" || true
            claude --version && break
            sleep 5
          done
          claude --version
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLUGIN: ${{ inputs.plugin }}
        run: |
          case "$PLUGIN" in *[!a-z0-9-]*|"") echo "plugin inválido"; exit 1;; esac
          claude plugin eval "plugins/$PLUGIN" --eval-dir "tests/evals/$PLUGIN" --no-publish --max-cost-usd 5 --json eval.json
