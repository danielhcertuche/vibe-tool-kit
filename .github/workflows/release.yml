name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SBOM por plugin (syft, contenedor efímero)
        env:
          KIT_OUT: ${{ runner.temp }}/sbom
        run: |
          for p in plugins/*/; do n=$(basename "$p")
            scripts/kit_ephemeral.sh syft "dir:/src/$p" -o "spdx-json=/out/$n.spdx.json"; done
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file CHANGELOG.md "$RUNNER_TEMP"/sbom/*.spdx.json
